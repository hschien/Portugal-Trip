function tick(){const el=$('#cd');if(!el)return;const n=Date.now(),a=new Date(S.trip.depart),z=new Date(S.trip.end);
if(n<a){const ms=a-n;el.innerHTML='出發倒數 <b>'+Math.floor(ms/864e5)+'</b> 天 '+Math.floor(ms%864e5/36e5)+' 時 '+Math.floor(ms%36e5/6e4)+' 分'}else if(n<z)el.textContent='旅行進行中 ✈️';else el.textContent='旅程完成，歡迎回家 🏠'}
function fillFlights(){$('#flight').innerHTML='<h2>✈️ 航班</h2>'+S.flights.map((f,i)=>{const b='flights.'+i;return `<article class="card"><div class="fl"><span class="tm">${E(b+'.dir','去程／回程')}</span><span class="sm">${E(b+'.date','日期')}</span></div><div class="big">${E(b+'.route','路線')}</div><div>${E(b+'.no','航班編號')} ${E(b+'.time','時間')}</div><div class="sm">${E(b+'.note','備註')}</div>${admin?mini('del-flight','✕ 刪除','data-i="'+i+'"'):''}</article>`}).join('')+btn('add-flight','新增航班')}
function tabs(){$('#tabs').innerHTML=S.days.map((d,i)=>`<button class="tab${i===cur?' on':''}" data-act="tab" data-i="${i}">${esc(d.date)}<small>${d.wk?'週'+esc(d.wk):''}</small></button>`).join('')}
function panel(anim){const d=S.days[cur];if(!d){$('#panel').innerHTML='';return}const b='days.'+cur;const its=d.items||(d.items=[]),sites=d.sites||(d.sites=[]);
const head=`<div class="card" style="background:var(--g)">${admin?`<div class="row">${E(b+'.date','日期')} ${E(b+'.wk','週幾')}</div>`:''}<b>${E(b+'.title','今日主題')}</b>${admin?`<div>${mini('mv-day','← 前移','data-d="-1"')}${mini('mv-day','後移 →','data-d="1"')}${mini('del-day','✕ 刪除這天')}</div>`:''}</div>`;
const list=its.map((it,i)=>{const p=b+'.items.'+i;return `<div class="it${it.m?' must':''}"><div class="card"><div class="row">${(admin||it.t)?`<span class="tm">${E(p+'.t','時間')}</span>`:''}${it.g&&!admin?`<span class="tag" style="background:${TAGC[it.g]||'var(--bg)'}">${esc(it.g)}</span>`:''}${it.m&&!admin?'<span class="must-b">必去</span>':''}</div>${admin?`<div>${sel(p+'.g',TAGOPTS)}${mini('must',it.m?'★ 必去':'☆ 必去','data-i="'+i+'"')}${mini('mv-item','↑','data-i="'+i+'" data-d="-1"')}${mini('mv-item','↓','data-i="'+i+'" data-d="1"')}${mini('del-item','✕ 刪除','data-i="'+i+'"')}</div>`:''}<h3>${E(p+'.n','行程')}</h3><div class="sm">${E(p+'.d','備註')}</div>${(admin||it.a)?`<div class="alt">${E(p+'.a','備選／其他菜色')}</div>`:''}</div></div>`}).join('');
const st=(sites.length||admin?'<h2 class="h2b">📖 景點故事</h2>':'')+sites.map((s,i)=>{const p=b+'.sites.'+i;return `<div class="card"><b>${E(p+'.n','景點')}</b><div class="sm">${E(p+'.t','故事')}</div>${admin?mini('del-site','✕ 刪除','data-i="'+i+'"'):''}</div>`}).join('')+btn('add-site','新增景點');
$('#panel').innerHTML=head+`<div class="tl${anim?' pop':''}">${list||'<p class="sm">這天還沒有行程</p>'}</div>`+btn('add-item','新增行程')+st}
function fillDays(){$('#days').innerHTML='<h2>🗓️ 每日行程</h2><div class="tabs" id="tabs"></div><div id="panel"></div>'+btn('add-day','新增一天');tabs();panel(false)}
function fillStays(){$('#hotel').innerHTML='<h2>🏨 住宿</h2>'+S.stays.map((s,i)=>{const b='stays.'+i;return `<article class="card"><div class="fl"><span class="tm">${E(b+'.city','城市')}</span><span class="sm">${E(b+'.dates','日期')}</span></div><div class="big">${E(b+'.name','住宿名稱')}</div><div>${E(b+'.addr','地址')}</div><div class="sm">${E(b+'.note','備註')}</div>${admin?mini('del-stay','✕ 刪除','data-i="'+i+'"'):''}</article>`}).join('')+btn('add-stay','新增住宿')}
function fillLists(){$('#lists').innerHTML='<h2>✅ 清單</h2>'+S.lists.map((L,i)=>{const b='lists.'+i,n=L.items.filter(x=>x.done).length;return `<div class="card"><b>${E(b+'.title','清單名稱')}</b> <span class="sm">${n}/${L.items.length}</span>${admin?' '+mini('del-list','✕ 刪除清單','data-i="'+i+'"'):''}${L.items.map((x,j)=>{const p=b+'.items.'+j;return admin?`<div class="ck">${E(p+'.text','項目')}${mini('del-chk','✕','data-p="'+p+'"')}</div>`:`<label class="ck${x.done?' done':''}"><input type="checkbox" data-chk="${p}"${x.done?' checked':''}><span>${esc(x.text)}</span></label>`}).join('')}${btn('add-chk','新增項目','data-k="'+b+'.items"')}</div>`}).join('')+btn('add-list','新增清單')}
function render(){document.body.classList.toggle('admin',admin);document.title=S.trip.title||'旅遊行程';$('#app').innerHTML='<main><section id="home"></section><section id="flight"></section><section id="days"></section><section id="lists"></section><section id="hotel"></section></main><footer>開放時間、車次與菜單請於 2027 出發前重查 🌷</footer>';fillNav();fillBar();fillHome();fillFlights();fillDays();fillLists();fillStays();tick()}
const closeModal=()=>{$('#modal').innerHTML=''};
function modal(title,fields,ok,okText){const m=$('#modal');m.innerHTML='<div class="ov"><form class="dlg card"><h3>'+esc(title)+'</h3>'+fields.map(f=>`<label class="fld">${esc(f.label)}<input type="${f.type||'text'}" name="${f.name}" placeholder="${esc(f.ph||'')}" autocomplete="off"></label>`).join('')+'<p class="err" id="merr"></p><div class="row"><button type="button" class="btn d" data-act="mclose">取消</button><button class="btn">'+(okText||'確定')+'</button></div></form></div>';
const f=m.querySelector('form');f.onsubmit=ev=>{ev.preventDefault();const v={};fields.forEach(x=>v[x.name]=f.elements[x.name].value);const r=ok(v);if(r===true)closeModal();else $('#merr').textContent=r||''};setTimeout(()=>{const i=f.querySelector('input');i&&i.focus()},40)}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
function exportHTML(){const c=document.documentElement.cloneNode(true);['#app','#nav','#adminbar','#modal'].forEach(s=>{const e=c.querySelector(s);e&&(e.innerHTML='')});const t=c.querySelector('#toast');t.textContent='';t.className='toast';c.querySelector('body').className='';
c.querySelector('#seed').textContent=JSON.stringify(S,null,1).replace(/</g,'\\u003c');c.querySelector('title').textContent=S.trip.title||'旅遊行程';dl('portugal-2027.html','<!DOCTYPE html>\n'+c.outerHTML,'text/html');toast('已下載更新後的網頁')}
const mv=(a,i,j)=>{if(j>=0&&j<a.length){const t=a[i];a[i]=a[j];a[j]=t;return true}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i,d=+b.dataset.d;const day=S.days[cur];
switch(a){
case 'tab':cur=i;tabs();panel(true);return;
case 'mclose':closeModal();return;
case 'login':modal('後台登入',[{name:'pw',label:'管理密碼',type:'password',ph:'請輸入密碼'}],v=>{if(!passOK(v.pw))return '密碼不正確';admin=true;try{sessionStorage.setItem('trip-adm','1')}catch(x){}render();toast('已進入後台模式');return true},'登入');return;
case 'logout':admin=false;try{sessionStorage.removeItem('trip-adm')}catch(x){}render();toast('已離開後台');return;
case 'add-flight':S.flights.push({dir:'新航班',date:'',route:'',no:'',time:'',note:''});save();fillFlights();return;
case 'del-flight':if(confirm('確定刪除這個航班？')){S.flights.splice(i,1);save();fillFlights()}return;
case 'add-day':S.days.push({date:'新日期',wk:'',title:'',items:[],sites:[]});cur=S.days.length-1;save();tabs();panel(true);return;
case 'del-day':if(S.days.length>1&&confirm('確定刪除這一天？')){S.days.splice(cur,1);if(cur>=S.days.length)cur=S.days.length-1;save();tabs();panel(true)}else if(S.days.length<=1)toast('至少要保留一天');return;
case 'mv-day':if(mv(S.days,cur,cur+d)){cur+=d;save();tabs();panel(false)}return;
case 'add-item':day.items.push({t:'',n:'新行程',d:'',g:'步行',m:false,a:''});save();panel(false);return;
case 'del-item':day.items.splice(i,1);save();panel(false);return;
case 'mv-item':if(mv(day.items,i,i+d)){save();panel(false)}return;
case 'must':day.items[i].m=!day.items[i].m;save();panel(false);return;
case 'add-site':day.sites.push({n:'新景點',t:''});save();panel(false);return;
case 'del-site':day.sites.splice(i,1);save();panel(false);return;
case 'add-stay':S.stays.push({city:'',dates:'',name:'新住宿',addr:'',note:''});save();fillStays();return;
case 'del-stay':if(confirm('確定刪除這個住宿？')){S.stays.splice(i,1);save();fillStays()}return;
case 'add-list':S.lists.push({title:'新清單',items:[]});save();fillLists();return;
case 'del-list':if(confirm('確定刪除整份清單？')){S.lists.splice(i,1);save();fillLists()}return;
case 'add-chk':getP(b.dataset.k).push({text:'新項目',done:false});save();fillLists();return;
case 'del-chk':{const k=b.dataset.p.split('.'),x=+k.pop();getP(k.join('.')).splice(x,1);save();fillLists();return}
case 'export-html':exportHTML();return;
case 'export-json':dl('portugal-2027-data.json',JSON.stringify(S,null,1),'application/json');toast('已匯出資料');return;
case 'import-json':$('#imp').click();return;
case 'reset':if(confirm('要把所有內容還原成網頁內建的預設資料嗎？目前的修改會消失。')){S=JSON.parse($('#seed').textContent);cur=0;save();render();toast('已還原預設')}return;
case 'chpass':modal('修改管理密碼',[{name:'p1',label:'新密碼（至少 4 碼）',type:'password'},{name:'p2',label:'再輸入一次',type:'password'}],v=>{if((v.p1||'').length<4)return '密碼至少 4 碼';if(v.p1!==v.p2)return '兩次輸入不一致';S.passHash=hash(v.p1);save();toast('密碼已更新，記得下載更新後的網頁');return true},'更新');return}});
$('#imp').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.days)||!o.trip)throw 0;S=o;cur=0;save();render();toast('匯入完成')}catch(x){toast('檔案格式不正確')}};r.readAsText(f);e.target.value=''});
document.addEventListener('input',e=>{const t=e.target,p=t.dataset&&t.dataset.path;if(!p)return;setP(p,t.isContentEditable?t.innerText.replace(/\u00a0/g,' ').replace(/\n+$/,''):t.value);save();if(p.startsWith('trip.d')||p==='trip.end')tick()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.chk){setP(t.dataset.chk+'.done',t.checked);save();fillLists()}});
document.addEventListener('focusout',e=>{const p=e.target.dataset&&e.target.dataset.path;if(p&&/^days\.\d+\.(date|wk)$/.test(p))tabs();if(p==='trip.title')document.title=S.trip.title});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&!e.shiftKey&&e.target.isContentEditable){e.preventDefault();e.target.blur()}});
document.addEventListener('paste',e=>{if(e.target.isContentEditable){e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))}});
{const n=Date.now(),a=new Date(S.trip.depart),z=new Date(S.trip.end);if(n>=a&&n<z)cur=Math.min(Math.floor((n-a)/864e5),S.days.length-1)}
render();setInterval(tick,30000);
})();
</script></body></html>
